# kube-prometheus-stack 91.8.1: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics.
# Release "kps" in namespace sixg-obs.
fullnameOverride: kps

# k3s runs these inside one process and does not expose them separately.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

alertmanager:
  alertmanagerSpec:
    resources: {requests: {memory: 64Mi}}

prometheus:
  prometheusSpec:
    scrapeInterval: 5s
    evaluationInterval: 5s
    retention: 7d
    resources: {requests: {memory: 512Mi}}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 20Gi}}
    additionalScrapeConfigs:
      # Every Open5GS network function that exposes /metrics (service name <nf>-metrics).
      - job_name: open5gs
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [sixg-core]}
        relabel_configs:
          - {source_labels: [__meta_kubernetes_service_name], regex: "(.+)-metrics", action: keep}
          # only the metrics port, never the SBI/PFCP ports of the same pod
          - {source_labels: [__address__], regex: ".+:9090", action: keep}
          - {source_labels: [__meta_kubernetes_service_name], regex: "(.+)-metrics", target_label: nf}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}

grafana:
  adminUser: admin
  # Password is generated by the chart and kept in secret kps-grafana.
  persistence: {enabled: true, size: 2Gi}
  grafana.ini:
    server:
      # reached from the host through the launcher's SSH tunnel on port 8661
      root_url: "http://127.0.0.1:8661/"
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
    analytics:
      reporting_enabled: false
      check_for_updates: false
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.sixg-obs.svc.cluster.local:3100
      access: proxy
      jsonData: {maxLines: 5000}
