# O-DU on sl04 (ZMQ simulated radio for now; swap ru_sdr to uhd for the B210).
# Run: sudo taskset -c 4-11 ~/oran/srsRAN_Project/build/apps/du/srsdu -c du_testbed.yml
gnb_id: 411
gnb_id_bit_length: 22
gnb_du_id: 0

f1ap:
  cu_cp_addr: 127.0.10.1           # where the CU-CP is
  bind_addr: 127.0.10.2            # DU's own F1 address

f1u:
  socket:
    - bind_addr: 127.0.10.2

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "99970"
  tac: 1
  slicing:
    - {sst: 1, sd: 1}
    - {sst: 2, sd: 2}
    - {sst: 3, sd: 3}
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 6
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

e2:
  enable_du_e2: true
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  addr: 10.0.2.10                  # OSC RIC e2term (Docker network on sl04)
  bind_addr: 10.0.2.1
  port: 36421

log:
  filename: /tmp/du.log
  all_level: info
  hex_max_size: 0

# Required: the DU computes its KPM values from these internal metrics. Without this block
# every KPM measurement reads zero.
metrics:
  enable_json: true
  periodicity:
    du_report_period: 1000
  layers:
    enable_sched: true
    enable_rlc: true
    enable_mac: true

# Per-UE metrics WebSocket, read by the testbed dashboard (SL04_WS).
remote_control:
  enabled: true
  bind_addr: 0.0.0.0
  port: 8001
