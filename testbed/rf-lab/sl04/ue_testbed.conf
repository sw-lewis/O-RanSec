# srsUE (ZMQ) on sl04 with a testbed identity (subscriber 999700000000401, eMBB slice).
# Run: sudo taskset -c 4-11 ~/oran/srsRAN_4G/build/srsue/src/srsue ue_testbed.conf
[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1

[rrc]
release = 15
ue_category = 4

[usim]
mode = soft
algo = milenage
opc = E8ED289DEBA952E4283B54E88E6183CA
k = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000401
imei = 353490069873401

[nas]
apn = embb
apn_protocol = ipv4

[slicing]
enable = true
nssai-sst = 1
nssai-sd = 1

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
all_level = warning
nas_level = info
rrc_level = info
filename = stdout
